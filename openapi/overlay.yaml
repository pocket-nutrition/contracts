# Overlay applied to openapi.upstream.json to produce openapi.patched.json.
#
# openapi.upstream.json is a verbatim snapshot of https://api.pocketnutrition.org/v3/api-docs
# (mirrored from pocket-nutrition-api/contract/openapi.json). Never hand-edit it.
#
# This is a DEEP-MERGE patch, not an OpenAPI Overlay 1.0 document. Overlay 1.0 addresses targets
# with JSONPath, which would mean shipping a JSONPath engine to express additions at fixed, known
# locations. A deep merge does the same job in ~40 lines of dependency-free Python
# (scripts/patch_spec.py) and reads as plain structure. Revisit if patches ever need wildcards or
# ordinal selection.
#
# NOTE: `required` arrays are NOT listed here. They are DERIVED from springdoc's nullability
# encoding by scripts/patch_spec.py, so a newly added DTO field is handled automatically instead
# of silently staying optional because nobody remembered to edit this file. See that script for
# the rule, and `requiredOverrides` below for the escape hatch.
#
# Every entry carries a `WHY:` comment. This file doubles as a bug report against the API: when an
# upstream fix lands, delete the corresponding section rather than letting it rot.

meta:
  overlayVersion: 1
  # Contract version this overlay was written against. patch_spec.py warns on mismatch.
  appliesToContractVersion: "2.0.0"

# ─────────────────────────────────────────────────────────────────────────────────────────
# 1. Nullability the derivation cannot see
# ─────────────────────────────────────────────────────────────────────────────────────────
# WHY: springdoc encodes nullability two different ways —
#   scalars/arrays/objects:  {"type": ["number", "null"]}
#   $ref properties:         {"oneOf": [{"$ref": ...}, {"type": "null"}]}
# patch_spec.py handles both, so no override is needed today (verified against contract 1.3.0 —
# the fields 1.2.0 and 1.3.0 added, `brand` and `foodGroup`, are nullable scalars, so derivation
# reads their nullability from the type array and correctly leaves them out of `required`).
#
# This block documents the shape of the residual risk: a BARE $ref property carries no nullability
# information at all. If the API ever adds a nullable $ref without the oneOf wrapper, derivation
# would mark it required, the generators would emit it non-optional, and the first null response
# would crash decoding. Add an `exclude` entry here if that happens.
#
# 1.4.0 added GET /ingredients/{id} (IngredientDetailResponse): its new scalar fields (foodGroup,
# referenceWeightG, displayUnit, canEatRaw, canEatCooked, typicalState) follow the same
# nullable-scalar shape as 1.2.0/1.3.0's brand/foodGroup, and referenceNutrition is a nullable $ref
# normalized by the same oneOf-unwrapping rule as IngredientSuggestionWithNutrition's own
# `nutrition` field — no new override needed.
#
# 2.0.0 (BREAKING) replaced every fixed per-language field pair (nameFr/nameEn, aliasesFr/
# aliasesEn, labelFr/labelEn, unitLabelFr/unitLabelEn) with a generic `List<LocalizedText>` —
# IngredientDetailResponse.names/aliases, ServingUnit.labels, IngredientSuggestion(WithNutrition)
# .unitLabels. The point of the change: a third language is now a knowledge-base data change only,
# never another field pair added to this contract. LocalizedText itself is a plain two-field
# object (lang, text), both non-nullable, so derivation marks both required with no override —
# same for the new list fields themselves, which are non-nullable arrays (an empty list is a valid
# "no data for this ingredient" value, not the same as the field being absent).
requiredOverrides: {}
  # Schema -> {include: [...], exclude: [...]}, applied after derivation. Example:
  #   IngredientSuggestionWithNutrition:
  #     exclude: [someBareRefNullableProperty]

# ─────────────────────────────────────────────────────────────────────────────────────────
# 2. Additions to the document
# ─────────────────────────────────────────────────────────────────────────────────────────
patch:
  paths:
    /ingredients/search:
      get:
        responses:
          "200":
            # WHY: IngredientController sets X-Segment-Count, but springdoc does not know about it,
            # so neither generator emits an accessor. The header is load-bearing: the picker enters
            # multi-select mode when it is > 1 (spec §7.1), and without it that whole interaction
            # silently disappears on mobile — with no error to notice.
            #
            # Related upstream bug this overlay does NOT fix: WebConfig.kt never calls
            # .exposedHeaders("X-Segment-Count"), so browsers cannot read it cross-origin. Native
            # clients are unaffected; the web sandbox only works because it proxies /api
            # same-origin through nginx.
            headers:
              X-Segment-Count:
                description: >-
                  Number of distinct food terms the server segmented the query into. Clients MUST
                  default to 1 when the header is absent. A value greater than 1 puts the result
                  list into multi-select mode.
                required: false
                schema:
                  type: integer
                  format: int32
                  minimum: 1

    # WHY: /health is annotated @Hidden in HealthController and so is absent from the document.
    # The apps call it to validate a user-entered server address before persisting it, which is
    # the core of the configurable-server feature. Declaring it here means that path is covered by
    # the same codegen as everything else instead of being hand-rolled twice.
    /health:
      get:
        tags: [Health]
        summary: Liveness probe
        description: >-
          Returns 200 with {"status":"ok"} when the service is up. Used by the mobile apps to
          validate a user-supplied server address before saving it.
        operationId: getHealth
        responses:
          "200":
            description: Service is up
            content:
              application/json:
                schema:
                  type: object
                  required: [status]
                  properties:
                    status:
                      type: string

# ─────────────────────────────────────────────────────────────────────────────────────────
# 3. Open enums
# ─────────────────────────────────────────────────────────────────────────────────────────
# WHY: a shipped binary cannot learn a new enum value. If the API adds an eighth cooking method or
# a fifth `source`, a client generated with closed enums either throws on decode or drops the
# record — and that is unfixable in an already-installed app. Each entry below gets
# x-extensible-enum, and both generators are configured to emit an unknown fallback case (see
# README, "Generating clients").
#
# This does not widen server validation: the API still rejects unknown values on input. It only
# makes clients tolerant readers on output.
extensibleEnums:
  - schema: FoodItemRequest
    property: unit
  - schema: FoodItemRequest
    property: cookingMethod
  - schema: FoodItemRequest
    property: measuredState
  - schema: NutritionalProfileResponse
    property: source

# Deliberately NOT listed above: FeedbackCorrection.category and .code. They are plain strings on
# the wire with no allowableValues annotation, and that is the right call — the server's
# CODES_BY_CATEGORY allowlist (FeedbackController) can gain a code without a contract change.
# The client-side taxonomy instead comes from the generated FeedbackCatalog (see ../vectors and
# the catalog emitter), which is checked against the server allowlist by contracts CI. Enumerating
# them here as well would create a third copy that has to be kept in sync with the other two.
#
# NutritionalProfileResponse.unit / .cookingMethod / .measuredState are also absent: springdoc
# emits no enum for them (they are plain String echoes of the request), so there is nothing to mark
# extensible. patch_spec.py fails loudly if that ever changes.
